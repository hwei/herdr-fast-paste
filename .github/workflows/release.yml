name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/herdr-fast-paste.exe dist/
          Copy-Item wezterm/herdr_fast_paste.lua dist/
          Compress-Archive -Path dist/* -DestinationPath herdr-fast-paste-windows-x86_64.zip
          $hash = (Get-FileHash -Algorithm SHA256 herdr-fast-paste-windows-x86_64.zip).Hash.ToLowerInvariant()
          "$hash  herdr-fast-paste-windows-x86_64.zip" | Set-Content herdr-fast-paste-windows-x86_64.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            herdr-fast-paste-windows-x86_64.zip
            herdr-fast-paste-windows-x86_64.zip.sha256

